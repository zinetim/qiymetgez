name: scrape

on:
  schedule:
    - cron: "0 3 * * *"      # hər gün 07:00 (Bakı vaxtı)
  workflow_dispatch:
    inputs:
      market:
        description: "araz | bazarstore (boş = hamısı)"
        required: false
        default: ""
      max_minutes:
        description: "hər market üçün maksimum dəqiqə"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Araz
        if: ${{ github.event.inputs.market == '' || github.event.inputs.market == 'araz' }}
        continue-on-error: true
        run: python -m scraper.run --market araz --max-minutes ${{ github.event.inputs.max_minutes || 120 }}
      - name: Commit (Araz)
        run: bash scripts/commit_data.sh

      - name: Bazarstore
        if: ${{ github.event.inputs.market == '' || github.event.inputs.market == 'bazarstore' }}
        continue-on-error: true
        env:
          SCRAPER_PROFILE: ${{ vars.SCRAPER_PROFILE }}
        run: python -m scraper.run --market bazarstore --max-minutes ${{ github.event.inputs.max_minutes || 120 }}
      - name: Commit (Bazarstore)
        run: bash scripts/commit_data.sh
