name: scrape

on:
  schedule:
    - cron: "0 3 * * *"      # hər gün 07:00 (Bakı vaxtı)
  workflow_dispatch:         # əl ilə işə salmaq üçün

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scraper (Araz, detallı)
        run: python -m scraper.run --market araz --details
      - name: Run scraper (Bazarstore)
        continue-on-error: true   # bloklansa belə Araz datası saxlanılsın
        env:
          SCRAPER_PROFILE: ${{ vars.SCRAPER_PROFILE }}   # boşdursa "bot"
        run: python -m scraper.run --market bazarstore
      - name: Commit data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || (git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M')" && git push)
